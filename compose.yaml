name: sqli-workshop

services:
  scanner-db:
    image: mysql:8.0
    container_name: sqli-scanner-db
    environment:
      MYSQL_DATABASE: ${SCANNER_DB_NAME}
      MYSQL_USER: ${SCANNER_DB_USER}
      MYSQL_PASSWORD: ${SCANNER_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SCANNER_DB_ROOT_PASSWORD}
    volumes:
      - scanner_db_data:/var/lib/mysql
      - ./infrastructure/mysql/scanner/init:/docker-entrypoint-initdb.d:ro
    networks:
      - scanner_net
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  lab-db:
    image: mysql:8.0
    container_name: sqli-lab-db
    environment:
      MYSQL_DATABASE: ${LAB_DB_NAME}
      MYSQL_USER: ${LAB_DB_USER}
      MYSQL_PASSWORD: ${LAB_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${LAB_DB_ROOT_PASSWORD}
    volumes:
      - lab_db_data:/var/lib/mysql
      - ./infrastructure/mysql/lab/init:/docker-entrypoint-initdb.d:ro
    networks:
      - lab_net
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend-placeholder:
    image: nginx:1.27-alpine
    container_name: sqli-backend-placeholder
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:80"
    networks:
      - public_net
      - scanner_net
    healthcheck:
      test:
        - CMD
        - wget
        - "-q"
        - "-O"
        - /dev/null
        - http://localhost
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  vulnerable-app:
    build:
      context: ./lab/app
      dockerfile: Dockerfile
    image: sqli-workshop-lab-app:local
    container_name: sqli-vulnerable-app
    environment:
      APP_PORT: ${LAB_APP_PORT:-8081}
      APP_MODE: vulnerable
      DB_HOST: ${LAB_DB_HOST}
      DB_PORT: ${LAB_DB_PORT}
      DB_NAME: ${LAB_DB_NAME}
      DB_USER: ${LAB_DB_USER}
      DB_PASSWORD: ${LAB_DB_PASSWORD}
    networks:
      - scanner_net
      - lab_net
    depends_on:
      lab-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - "-q"
        - "-O"
        - /dev/null
        - http://localhost:8081/health
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  secure-app:
    build:
      context: ./lab/app
      dockerfile: Dockerfile
    image: sqli-workshop-lab-app:local
    container_name: sqli-secure-app
    environment:
      APP_PORT: ${LAB_APP_PORT:-8081}
      APP_MODE: secure
      DB_HOST: ${LAB_DB_HOST}
      DB_PORT: ${LAB_DB_PORT}
      DB_NAME: ${LAB_DB_NAME}
      DB_USER: ${LAB_DB_USER}
      DB_PASSWORD: ${LAB_DB_PASSWORD}
    networks:
      - scanner_net
      - lab_net
    depends_on:
      lab-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - "-q"
        - "-O"
        - /dev/null
        - http://localhost:8081/health
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
networks:
  public_net:
    name: sqli-public-net
    driver: bridge

  scanner_net:
    name: sqli-scanner-net
    driver: bridge
    internal: true

  lab_net:
    name: sqli-lab-net
    driver: bridge
    internal: true

volumes:
  scanner_db_data:
    name: sqli-scanner-db-data

  lab_db_data:
    name: sqli-lab-db-data
